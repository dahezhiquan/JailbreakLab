name: JailbreakLab
options:
  bundleIdPrefix: com.securitylab
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  JailbreakLab:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared/HelperBridge.c
      - path: Shared/HelperBridge.h
        buildPhase: headers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securitylab.jailbreaklab
        PRODUCT_NAME: JailbreakLab
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/JailbreakLab.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: App/Resources/JailbreakLab-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  JailbreakLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: JailbreakLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securitylab.jailbreaklab.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JailbreakLab.app/JailbreakLab"
        BUNDLE_LOADER: "$(TEST_HOST)"
